name: Central Dashboard Notification

on:
  push:
    branches:
      - "**"

jobs:
  notify_dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Notify pending
        env:
          WEBHOOK_URL: ${{ secrets.DASHBOARD_WEBHOOK_URL }}
        run: |
          curl --silent --show-error -X POST -H "Content-Type: application/json" \
          -d '{
            "project_name": "DevOps Deployment Dashboard",
            "repository": "${{ github.event.repository.name }}",
            "repository_full_name": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "developer": "${{ github.actor }}",
            "commit_message": "Workflow started",
            "commit_url": "${{ github.event.head_commit.url }}",
            "commit_id": "${{ github.sha }}",
            "timestamp": "${{ github.event.head_commit.timestamp }}",
            "status": "pending"
          }' \
          $WEBHOOK_URL || true

      - name: Notify running
        env:
          WEBHOOK_URL: ${{ secrets.DASHBOARD_WEBHOOK_URL }}
        run: |
          curl --silent --show-error -X POST -H "Content-Type: application/json" \
          -d '{
            "project_name": "DevOps Deployment Dashboard",
            "repository": "${{ github.event.repository.name }}",
            "repository_full_name": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "developer": "${{ github.actor }}",
            "commit_message": "Workflow running",
            "commit_url": "${{ github.event.head_commit.url }}",
            "commit_id": "${{ github.sha }}",
            "timestamp": "${{ github.event.head_commit.timestamp }}",
            "status": "running"
          }' \
          $WEBHOOK_URL || true

      - name: Simulate work
        run: sleep 20

      # Uncomment to test failure
      # - name: Force fail
      #   run: exit 1

      - name: Notify success
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.DASHBOARD_WEBHOOK_URL }}
        run: |
          curl --silent --show-error -X POST -H "Content-Type: application/json" \
          -d '{
            "project_name": "DevOps Deployment Dashboard",
            "repository": "${{ github.event.repository.name }}",
            "repository_full_name": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "developer": "${{ github.actor }}",
            "commit_message": "Workflow completed successfully",
            "commit_url": "${{ github.event.head_commit.url }}",
            "commit_id": "${{ github.sha }}",
            "timestamp": "${{ github.event.head_commit.timestamp }}",
            "status": "success"
          }' \
          $WEBHOOK_URL || true

      - name: Notify failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.DASHBOARD_WEBHOOK_URL }}
        run: |
          curl --silent --show-error -X POST -H "Content-Type: application/json" \
          -d '{
            "project_name": "DevOps Deployment Dashboard",
            "repository": "${{ github.event.repository.name }}",
            "repository_full_name": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "developer": "${{ github.actor }}",
            "commit_message": "Workflow failed",
            "commit_url": "${{ github.event.head_commit.url }}",
            "commit_id": "${{ github.sha }}",
            "timestamp": "${{ github.event.head_commit.timestamp }}",
            "status": "failed"
          }' \
          $WEBHOOK_URL || true